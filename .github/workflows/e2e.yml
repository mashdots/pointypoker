name: E2E Tests

# Reusable workflow: runs the Playwright end-to-end suite against the v3
# experience using the offline Firebase emulator (demo project — no secrets).
on:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run e2e tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
